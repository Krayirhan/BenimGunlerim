name: Android

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  pr-quality:
    name: PR quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Unit test coverage
        run: ./gradlew jacocoDebugUnitTestCoverageVerification

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-coverage-report
          path: app/build/reports/jacoco/jacocoDebugUnitTestReport/

      - name: Lint
        run: ./gradlew lintDebug

      - name: Static analysis (detekt)
        run: ./gradlew detekt

      - name: Debug build
        run: ./gradlew assembleDebug

  release-quality:
    name: Release quality gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/benimgunlerim-release.jks"
          fi

      - name: Release checks
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore/benimgunlerim-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew verifyReleaseSigning testDebugUnitTest jacocoDebugUnitTestCoverageVerification lintRelease assembleRelease bundleRelease

      - name: Upload release unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload release coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-coverage-report
          path: app/build/reports/jacoco/jacocoDebugUnitTestReport/

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-lint-report
          path: app/build/reports/lint-results-release.html

      - name: Upload release bundle
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: benimgunlerim-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

  connected-ui-tests:
    name: Connected UI tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            mkdir -p artifacts
            set +e
            ./gradlew connectedDebugAndroidTest
            status=$?
            adb logcat -d > artifacts/connected-logcat.txt
            exit $status

      - name: Upload connected test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: connected-test-report
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            artifacts/connected-logcat.txt

  performance-deep-gate:
    name: Performance deep gate
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run macrobenchmark
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: ./gradlew :benchmark:connectedCheck

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macrobenchmark-report
          path: |
            benchmark/build/reports/**
            benchmark/build/outputs/**
